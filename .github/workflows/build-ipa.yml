name: Build Midrar iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bundle Complete Offline Uthmani Quran (604 Pages, 6,236 Ayahs)
        run: |
          mkdir -p Midrar/Resources
          if [ ! -f Midrar/Resources/quran_uthmani_full.json ]; then
            curl -fsSL "https://api.alquran.cloud/v1/quran/quran-uthmani" -o Midrar/Resources/quran_uthmani_full.json || true
          fi
          ls -lh Midrar/Resources/quran_uthmani_full.json || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned Release App
        run: |
          xcodebuild -project Midrar.xcodeproj \
            -scheme Midrar \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package Midrar.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Midrar.app Payload/
          zip -r -q Midrar.ipa Payload
          ls -lh Midrar.ipa

      - name: Upload Midrar.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Midrar-iOS-IPA
          path: Midrar.ipa
          retention-days: 30

      - name: Publish GitHub Release v5.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v5.2 >/dev/null 2>&1; then
            gh release upload v5.2 Midrar.ipa --clobber
          else
            gh release create v5.2 Midrar.ipa --title "Midrar iOS v5.2" --notes "Midrar iOS V5.2: 100K Mosque Journey + Offline Quran + Auto GPS Prayers"
          fi
