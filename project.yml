name: Midrar
options:
  bundleIdPrefix: com.midrar
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "5.4"
    CURRENT_PROJECT_VERSION: "7"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Midrar:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      base:
        PRODUCT_NAME: Midrar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: Midrar/Sources
      - path: Midrar/Resources/Assets.xcassets
      - path: Midrar/Resources/cinema
        type: folder
        buildPhase: resources
      - path: Midrar/Resources/quran_uthmani_full.json
        type: file
        optional: true
        buildPhase: resources
    dependencies:
      - target: MidrarWidgetExtension
        embed: true
    info:
      path: Midrar/Info.plist
      properties:
        CFBundleDisplayName: مدرار
        CFBundleShortVersionString: "5.4"
        CFBundleVersion: "7"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "نستخدم الميكروفون لحساب استغفارك وذكرك بالصوت تلقائياً بدون إنترنت"
        NSLocationWhenInUseUsageDescription: "نستخدم موقعك لتحديد مواقيت الصلوات الخمس واتجاه القبلة بدقة حسب مدينتك"
        NSPhotoLibraryUsageDescription: "لاختيار صورة شخصية لملفك داخل التطبيق"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  MidrarWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      base:
        PRODUCT_NAME: MidrarWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.midrar.Midrar.Widget
        SKIP_INSTALL: YES
    sources:
      - path: MidrarWidget
    info:
      path: MidrarWidget/Info.plist
      properties:
        CFBundleDisplayName: مدرار
        CFBundleShortVersionString: "5.4"
        CFBundleVersion: "7"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
